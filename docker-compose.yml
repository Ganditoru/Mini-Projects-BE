services:
  evently.api:
    image: ${DOCKER_REGISTRY-}eventlyapi
    container_name: Authentification.Api
    build:
      context: .
      dockerfile: Authentification.Api/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081

  evently.database:
    image: postgres:latest
    container_name: Authentification.Database
    environment:
      - POSTGRES_DB=evently
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/db:/var/lib/postgresql/data
    ports:
      - 5433:5432